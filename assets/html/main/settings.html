<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snitch - Settings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/main/dashboard.css">
    <link rel="stylesheet" href="../../css/main/pages.css">
    <link rel="stylesheet" href="../../css/main/theme.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../../files/icons/Teacher.png" alt="Snitch Logo">
                <h2>Snitch</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="dashboard.html">
                            <i class="fas fa-home"></i>
                            Dashboard
                        </a>
                    </li>
                    <li>
                        <a href="profile.html">
                            <i class="fas fa-user"></i>
                            Profile
                        </a>
                    </li>
                    <li>
                        <a href="classroom.html">
                            <i class="fas fa-chalkboard"></i>
                            Classroom
                        </a>
                    </li>
                    <li>
                        <a href="settings.html" class="active">
                            <i class="fas fa-cog"></i>
                            Settings
                        </a>
                    </li>
                    <li>
                        <a href="help.html">
                            <i class="fas fa-question-circle"></i>
                            Help
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <a href="login.html" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search settings...">
                </div>
                <div class="user-profile">
                    <div class="notifications">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge">3</span>
                    </div>
                    <div class="profile-dropdown">
                        <img src="../../images/default-profile.jpg" alt="Profile" class="profile-img">
                        <span class="username">John Doe</span>
                    </div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="content-area">
                <div class="welcome-section">
                    <h1>Settings</h1>
                    <p>Customize your experience</p>
                </div>
                <div class="settings-content">
                    <div class="settings-card">
                        <h3>Account Settings</h3>
                        <div class="settings-group">
                            <div class="setting-item">
                                <label>Email Notifications</label>
                                <div class="toggle-switch">
                                    <input type="checkbox" id="email-notifications" checked>
                                    <label for="email-notifications"></label>
                                </div>
                            </div>
                            <div class="setting-item">
                                <label>Dark Mode</label>
                                <div class="toggle-switch">
                                    <input type="checkbox" id="dark-mode" checked>
                                    <label for="dark-mode"></label>
                                </div>
                            </div>
                            <div class="setting-item">
                                <label>Two-Factor Authentication</label>
                                <div class="toggle-switch">
                                    <input type="checkbox" id="two-factor">
                                    <label for="two-factor"></label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="settings-card">
                        <h3>Privacy Settings</h3>
                        <div class="settings-group">
                            <div class="setting-item">
                                <label>Show Online Status</label>
                                <div class="toggle-switch">
                                    <input type="checkbox" id="online-status" checked>
                                    <label for="online-status"></label>
                                </div>
                            </div>
                            <div class="setting-item">
                                <label>Allow Profile Views</label>
                                <div class="toggle-switch">
                                    <input type="checkbox" id="profile-views" checked>
                                    <label for="profile-views"></label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="settings-card">
                        <h3>Security</h3>
                        <div class="settings-group">
                            <div class="setting-item">
                                <label>Change Password</label>
                                <button class="change-password-btn">
                                    <i class="fas fa-key"></i> Change
                                </button>
                            </div>
                            <div class="setting-item">
                                <label>Login History</label>
                                <button class="view-history-btn">
                                    <i class="fas fa-history"></i> View
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/main/common.js"></script>
    <script src="../../js/main/settings.js"></script>
</body>
</html>
