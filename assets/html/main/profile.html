<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Snitch - Profile</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    
    <!-- External CSS -->
    <link rel="stylesheet" href="../../css/main/dashboard.css" />
    <link rel="stylesheet" href="../../css/main/pages.css" />
    <link rel="stylesheet" href="../../css/main/theme.css" />

    <!-- Internal Styles -->
    <style>
        /* General Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            overflow: auto;
        }

        .modal-content {
            background-color: #222;
            color: #fff;
            margin: 5% auto;
            padding: 25px;
            width: 60%;
            max-width: 600px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            animation: modalIn 0.3s ease-out;
        }

        @keyframes modalIn {
            from {transform: translateY(-50px); opacity: 0;}
            to {transform: translateY(0); opacity: 1;}
        }

        .close-modal {
            float: right;
            font-size: 28px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
        }

        .close-modal:hover { color: #fff; }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #ccc;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 5px;
            font-size: 16px;
            background-color: #333;
            color: #fff;
        }

        .form-group input:focus {
            outline: none;
            border-color: #fff;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .form-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 25px;
        }

        .cancel-btn, .save-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cancel-btn {
            background-color: #444;
            color: #fff;
        }

        .save-btn {
            background-color: #0059ff;
            color: #fff;
        }

        .cancel-btn:hover {
            background-color: #555;
        }

        .save-btn:hover {
            background-color: #0084ff;
        }

        /* Profile Picture Styles */
        .profile-picture-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 5px;
            background-color: #2a2a2a;
        }

        .profile-picture-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #fff;
        }

        .profile-picture-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
            margin-top: 10px;
        }

        .picture-btn {
            padding: 8px 12px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-btn {
            background-color: #002fff;
            color: #fff;
        }

        .remove-btn {
            background-color: #f44336;
            color: #fff;
        }

        .upload-btn:hover { background-color: #0051ff; }
        .remove-btn:hover { background-color: #d32f2f; }

        #profilePictureUpload {
            display: none;
        }

        .picture-info {
            font-size: 12px;
            color: #aaa;
            text-align: center;
            margin-top: 8px;
        }

        .modal-content h2 {
            margin-top: 10px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
        }
    </style>
</head>

<body>
<div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="../../files/icons/Teacher.png" alt="Snitch Logo" />
            <h2>Snitch</h2>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="profile.html" class="active"><i class="fas fa-user"></i> Profile</a></li>
                <li><a href="classroom.html"><i class="fas fa-chalkboard"></i> Classroom</a></li>
                <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
                <li><a href="help.html"><i class="fas fa-question-circle"></i> Help</a></li>
            </ul>
        </nav>
        <div class="sidebar-footer">
            <a href="login.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="top-bar">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search..." />
            </div>
            <div class="user-profile">
                <div class="notifications">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge">3</span>
                </div>
                <div class="profile-dropdown">
                    <img src="../../files/images/default-profile.png" alt="Profile" class="profile-img" />
                    <span class="username">John Doe</span>
                </div>
            </div>
        </div>

        <div class="content-area">
            <div class="welcome-section">
                <h1>Profile Settings</h1>
                <p>Manage your account information and preferences</p>
            </div>
            <div class="profile-content">
                <div class="profile-card">
                    <div class="profile-header">
                        <img src="../../files/images/default-profile.png" alt="Profile" class="profile-large" />
                        <div class="profile-info">
                            <h2 class="profile-name">John Doe</h2>
                            <p class="profile-role" id="displayRole">Teacher</p>
                            <button class="edit-profile-btn">
                                <i class="fas fa-edit"></i> Edit Profile
                            </button>
                        </div>
                    </div>
                    <div class="profile-details">
                        <div class="detail-item">
                            <label>Email</label>
                            <p id="displayEmailAddress">none</p>
                        </div>
                        <div class="detail-item">
                            <label>Contact Number</label>
                            <p id="displayContactNumber">none</p>
                        </div>
                        <div class="detail-item" id="classesCreatedGroup" style="display: none;">
                            <label>Classes Created</label>
                            <p id="displayClassesCreated">none</p>
                        </div>
                        <div class="detail-item" id="classActivitiesGroup" style="display: none;">
                            <label>Activities</label>
                            <p id="displayClassActivities">none</p>
                        </div>
                        <div class="detail-item" id="classesJoinedGroup" style="display: none;">
                            <label>Classes Joined</label>
                            <p id="displayClassesJoined">0</p>
                        </div>
                        <div class="detail-item" id="answeredActivitiesGroup" style="display: none;">
                            <label>Answered Activities</label>
                            <p id="displayAnsweredActivities">0</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Edit Profile Modal -->
<div id="editProfileModal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2>Edit Profile</h2>
        <form id="editProfileForm">
            <div class="form-group">
                <label for="profileName">Full Name</label>
                <input type="text" id="profileName" value="John Doe" />
            </div>
            <div class="form-group">
                <label for="profileContactNumber">Contact Number</label>
                <input type="tel" id="profileContactNumber" value="+1 234 567 890" />
            </div>
            <div class="form-group">
                <label>Profile Picture</label>
                <div class="profile-picture-container">
                    <img src="../../files/images/default-profile.png" class="profile-picture-preview" id="picturePreview" />
                    <div class="profile-picture-controls">
                        <input type="file" id="profilePictureUpload" accept="image/*" />
                        <button type="button" class="picture-btn upload-btn" id="uploadPictureBtn"><i class="fas fa-upload"></i> Upload Photo</button>
                        <button type="button" class="picture-btn remove-btn" id="removePictureBtn"><i class="fas fa-trash"></i> Remove</button>
                    </div>
                    <p class="picture-info">Recommended: Square image, at least 200x200 pixels</p>
                </div>
            </div>
            <div class="form-buttons">
                <button type="button" class="cancel-btn">Cancel</button>
                <button type="submit" class="save-btn">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<!-- External Scripts -->
<script src="../../js/main/pages.js"></script>
<script src="../../js/main/profile.js"></script>

</body>
</html>
